services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jiandi}
      MYSQL_USER: ${MYSQL_USER:-jiandi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jiandi_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "3307:3306"
    volumes:
      - jiandi_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-jiandi}:${MYSQL_PASSWORD:-jiandi_dev}@mysql:3306/${MYSQL_DATABASE:-jiandi}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-jiandi-local-secret}
      APP_ENV: ${APP_ENV:-development}
      GUEST_TOKEN_TTL_HOURS: ${GUEST_TOKEN_TTL_HOURS:-168}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-168}
      TEST_AUTH_ENABLED: ${TEST_AUTH_ENABLED:-false}
      TEST_AUTH_USERS: ${TEST_AUTH_USERS:-tester-a,tester-b}
      ALLOW_DEMO_ARRIVAL: ${ALLOW_DEMO_ARRIVAL:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENABLE_FRAGMENT_AUDIO_TOURS: ${ENABLE_FRAGMENT_AUDIO_TOURS:-true}
      EVIDENCE_UPLOAD_ENABLED: ${EVIDENCE_UPLOAD_ENABLED:-true}
      EVIDENCE_ROOT: /app/private-evidence
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-10485760}
      EVIDENCE_MAX_EDGE: ${EVIDENCE_MAX_EDGE:-4096}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-30}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_PUBLIC_BUCKET: ${OSS_PUBLIC_BUCKET:-}
      OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_SIGNED_URL_TTL_SECONDS: ${OSS_SIGNED_URL_TTL_SECONDS:-300}
    volumes:
      - jiandi_evidence:/app/private-evidence
      - ${MEDIA_HOST_PATH:-./backend/media}:/app/media
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  jiandi_mysql:
  jiandi_evidence:
