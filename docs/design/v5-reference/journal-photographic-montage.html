root.querySelectorAll('.jd-stage').forEach((stage,slot)=>{
 const variant=stage.closest('section').dataset.variant==='摄影叠印'?1:0;

 const layers=[outgoing,incoming];
 function fill(elements,r){

 }
 function prepare(){fill(outgoing,routes[index]);fill(incoming,routes[1-index]);}

 function photoPath(c,town){
  c.beginPath();
  if(!town){c.moveTo(150,131);c.lineTo(390,131);c.lineTo(390,410);c.quadraticCurveTo(390,438,358,438);c.lineTo(60,438);c.lineTo(60,222);c.quadraticCurveTo(76,160,150,131);}

  c.closePath();
 }
 function imageCover(c,img,x,y,w,h,shift=0,scale=1){
  if(!img.complete||!img.naturalWidth)return;
  const ratio=Math.max(w/img.naturalWidth,h/img.naturalHeight)*scale;
  const dw=img.naturalWidth*ratio,dh=img.naturalHeight*ratio;
  c.drawImage(img,x+(w-dw)/2+shift,y+(h-dh)/2,dw,dh);
 }
 function drawPhoto(c,i,shift=0,scale=1){
  c.save();photoPath(c,i===1);c.clip();
  imageCover(c,images[i],45,125,370,320,shift,scale);
  const gradient=c.createLinearGradient(0,325,0,450);gradient.addColorStop(0,'#12221a00');gradient.addColorStop(1,'#12221a66');c.fillStyle=gradient;c.fillRect(40,125,365,325);c.restore();

 function reset(){p=0;prepare();render();phone.querySelector('.jd-number').textContent=String(index+1).padStart(2,'0');phone.querySelector('.jd-save').setAttribute('aria-pressed',String(saved[index]));}
